packages:
  - .

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  msgpackr-extract: set this to true or false
  nx: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
  workerd: set this to true or false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
